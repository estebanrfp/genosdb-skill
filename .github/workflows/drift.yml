# Drift check: this repository is a mirror of skills/genosdb in the engine.
# The engine's private repo publishes here on every change (sync-skill.yml).
# This job is the second lock: once a week, and on demand, it compares every
# file with the public engine repo (gdb, which the same engine publishes) and
# fails loudly if anything differs — so a broken sync is noticed, not discovered.
name: Drift check against gdb

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the engine's copy
        run: |
          set -e
          mkdir -p /tmp/engine
          for f in $(gh api repos/estebanrfp/gdb/contents/skills/genosdb --jq '.[] | select(.type=="file") | .name'); do
            curl -sSf "https://raw.githubusercontent.com/estebanrfp/gdb/main/skills/genosdb/$f" -o "/tmp/engine/$f"
          done
          ls /tmp/engine
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compare
        run: |
          if diff -r /tmp/engine skills/genosdb; then
            echo "in sync with gdb"
          else
            echo "::error::skills/genosdb differs from the engine's published copy — run the sync"
            exit 1
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="genosdb-skill: the official GenosDB skill for AI coding agents">
  <defs><style>.f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 2.6px; fill: #9aa3ad; }
.h { font-size: 64px; font-weight: 700; fill: #e6e9ee; letter-spacing: -1.2px; }
.sub { font-size: 22px; fill: #9aa3ad; }
.card-t { font-size: 18px; font-weight: 600; fill: #e6e9ee; }
.card-s { font-size: 14px; fill: #6b7480; }
.cmd { font-size: 14px; fill: #34c77b; }
.tag { font-size: 14px; font-weight: 600; fill: #34c77b; letter-spacing: .6px; }</style></defs>
  <rect width="1200" height="600" fill="#14171c"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#262b33"/>
  <g class="f">
    <text x="80" y="150" class="eyebrow">GENOSDB · OFFICIAL SKILL FOR AI CODING AGENTS</text>
    <text x="80" y="250" class="h">Teach your agent</text>
    <text x="80" y="322" class="h">GenosDB</text>
    <rect x="80" y="356" width="48" height="3" fill="#34c77b"/>
    <text x="80" y="408" class="sub">The frozen API, the patterns, the security model,</text>
    <text x="80" y="440" class="sub">how to prove sync, and the traps that cost hours.</text>
  </g>
  <g transform="translate(80 478)">
    <rect x="0" y="0" width="640" height="44" rx="8" fill="#1b1f26" stroke="#2f3641"/>
    <text x="18" y="28" class="mono cmd" style="font-size:13px">$ npx skills add https://github.com/estebanrfp/genosdb-skill --skill genosdb</text>
  </g>
  <g transform="translate(760 122)" class="f">
    <g transform="translate(0 0)"><rect x="0" y="0" width="360" height="48" rx="8" fill="#1b1f26" stroke="#2f3641"/><rect x="16" y="21" width="6" height="6" fill="#34c77b"/><text x="34" y="30" class="card-t">SKILL.md</text><text x="344" y="30" text-anchor="end" class="card-s">the entry point</text></g>
    <g transform="translate(0 60)"><rect x="0" y="0" width="360" height="48" rx="8" fill="#1b1f26" stroke="#2f3641"/><rect x="16" y="21" width="6" height="6" fill="#34c77b"/><text x="34" y="30" class="card-t">API.md</text><text x="344" y="30" text-anchor="end" class="card-s">the frozen surface</text></g>
    <g transform="translate(0 120)"><rect x="0" y="0" width="360" height="48" rx="8" fill="#1b1f26" stroke="#2f3641"/><rect x="16" y="21" width="6" height="6" fill="#34c77b"/><text x="34" y="30" class="card-t">PATTERNS.md</text><text x="344" y="30" text-anchor="end" class="card-s">modeling and realtime UI</text></g>
    <g transform="translate(0 180)"><rect x="0" y="0" width="360" height="48" rx="8" fill="#1b1f26" stroke="#2f3641"/><rect x="16" y="21" width="6" height="6" fill="#34c77b"/><text x="34" y="30" class="card-t">SECURITY.md</text><text x="344" y="30" text-anchor="end" class="card-s">the zero-trust model</text></g>
    <g transform="translate(0 240)"><rect x="0" y="0" width="360" height="48" rx="8" fill="#1b1f26" stroke="#2f3641"/><rect x="16" y="21" width="6" height="6" fill="#34c77b"/><text x="34" y="30" class="card-t">TESTING.md</text><text x="344" y="30" text-anchor="end" class="card-s">proving sync with Playwright</text></g>
    <g transform="translate(0 300)"><rect x="0" y="0" width="360" height="48" rx="8" fill="#1b1f26" stroke="#2f3641"/><rect x="16" y="21" width="6" height="6" fill="#34c77b"/><text x="34" y="30" class="card-t">PITFALLS.md</text><text x="344" y="30" text-anchor="end" class="card-s">“it doesn't sync”, in order</text></g>
  </g>
  <text x="1120" y="556" text-anchor="end" class="f tag">genosdb.com</text>
</svg>
